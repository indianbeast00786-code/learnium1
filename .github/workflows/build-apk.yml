name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Unable to detect Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java 17 or higher is required. Found version: $JAVA_VER"
            exit 1
          fi
          echo "Java environment verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "debug.keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$TARGET_APK" ] && [ -s "$TARGET_APK" ]; then
            echo "APK found and verified: $TARGET_APK"
            ls -lh "$TARGET_APK"
          else
            echo "Error: Expected APK not found at $TARGET_APK"
            echo "Searching inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${RUNNER_TEMP}/apk-release"
          mkdir -p "$ASSET_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_DIR/app-debug.apk"
          if [ ! -f "$ASSET_DIR/app-debug.apk" ] || [ ! -s "$ASSET_DIR/app-debug.apk" ]; then
            echo "Error: Prepared release asset missing or empty."
            exit 1
          fi
          echo "Prepared release asset: $ASSET_DIR/app-debug.apk"
          echo "asset_path=$ASSET_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_FILE="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_FILE" ]; then
            echo "Error: Release asset $ASSET_FILE not found."
            exit 1
          fi
          if [ ! -s "$ASSET_FILE" ]; then
            echo "Error: Release asset $ASSET_FILE is empty."
            exit 1
          fi
          if [[ "$ASSET_FILE" != *.apk ]]; then
            echo "Error: Release asset does not have .apk extension."
            exit 1
          fi
          ASSET_BASENAME=$(basename "$ASSET_FILE")
          if [ "$ASSET_BASENAME" != "app-debug.apk" ]; then
            echo "Error: Release asset filename must be exactly app-debug.apk. Found: $ASSET_BASENAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          cat <<EOF > "$NOTES_FILE"
          ## Learnium Inventory - Debug APK Build #${{ github.run_number }}

          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: ${{ github.sha }}
          - **Note**: This APK is intended for testing and demonstration purposes. It is not a Play Store production release and is signed with a debug keystore.
          EOF

          echo "Creating GitHub Release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            "$ASSET_FILE" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" == "success" ]; then
            echo "=== GitHub Release Published Successfully ==="
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Asset: app-debug.apk"
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"

            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Direct download link: [$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The GitHub Actions artifact **app-debug-apk** is also available as a backup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not complete successfully or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK build succeeded and the GitHub Actions backup artifact 'app-debug-apk' remains available for download."
            fi
          fi
